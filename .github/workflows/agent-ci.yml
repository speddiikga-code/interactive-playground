name: agent-ci

# CI runs the *identical* gate the agents run locally. That symmetry is the
# whole point: an agent cannot be "green locally, red in CI", because there is
# only one definition of green.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan sees tracked files properly.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: preflight
        run: ./scripts/preflight.sh

  route-check:
    # Not a gate — a smoke test that the routing helper still runs. If this
    # breaks, the cost guidance in the docs is quietly wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/agent-route.mjs --json "audit every route handler for auth"
